version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "node-linker=hoisted" > .npmrc
        - npm i -g pnpm
        - pnpm config set store-dir ./.amplify-hosting/compute/default/.pnpm-store
        - pnpm i
    build:
      commands:
        - env >> .env
        - pnpm run build
        - mv .env ./.amplify-hosting/compute/default/.env

  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"

  cache:
    paths:
      - ./.amplify-hosting/compute/default/.pnpm-store/**/*
