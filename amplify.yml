version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "node-linker=hoisted" > .npmrc
        - npm i -g pnpm
        - pnpm config set store-dir .pnpm-store
        - pnpm i
    build:
      commands:
        - env >> .env
        - pnpm run build
        - mv .env ./.amplify-hosting/compute/default/.env
        # - mv pnpm-store ./.amplify-hosting/compute/default

  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"

  cache:
    paths:
      - .pnpm-store/**/*
