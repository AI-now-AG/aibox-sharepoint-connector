[build]
  functions = "functions" 
  publish = "dist"     

[dev]
  command = "pnpm run dev"    

[[headers]]
  for = "/api/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, X-API-Key"
    Access-Control-Max-Age = "86400"

[functions]
  node_bundler = "esbuild"
  included_files = ["bin/osx/**", "bin/linux/**"]

  [functions."transcribeAudio-background"]
    timeout = 900 
    memory = 1024

  [functions."postAudioProProcess-background"]
    timeout = 900
    memory = 1024

  [functions."api/audio/convert-to-mono"]
    timeout = 3600
    memory = 3008 # Maximum memory allocation for large file processing
    maxDuration = 3600
    keepalive = true # Enable keep-alive support

  [functions.max_lambda_size]
    value = "50mb"