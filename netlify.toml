[build]
  functions = "functions"  # Directory where your functions are located
  publish = "dist"         # Directory for your built site

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

  [functions."uploadAudio-background"]
    timeout = 900 
    memory = 1024

  [functions.max_lambda_size]
    value = "50mb"
