[build]
  functions = "functions" 
  publish = "dist"         

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

  [functions."transcribeAudio-background"]
    timeout = 900 
    memory = 1024

  [functions.max_lambda_size]
    value = "1024mb"